<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>lan-telegram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="mesh" aria-hidden="true"></div>

  <div id="app">
    <aside id="sidebar" class="glass">
      <header class="side-head">
        <div id="me">
          <div class="me-avatar" id="me-avatar">我</div>
          <div class="me-text">
            <div id="me-name">…</div>
            <div id="me-state">连接中</div>
          </div>
        </div>
        <button id="theme-toggle" class="icon-btn" title="切换明暗">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </header>
      <button id="new-chat" class="pill-btn primary">＋ 新对话</button>
      <ul id="convs" aria-label="会话列表"></ul>
      <footer class="side-foot"><span id="foot-state">lan-telegram</span></footer>
    </aside>

    <main id="main">
      <div id="empty" class="glass-card">
        <div class="empty-orb"></div>
        <p>选择左侧会话，或点「新对话」</p>
        <p class="hint">消息点对点直连 · TLS 1.3 可选 · 永不出局域网</p>
      </div>

      <div id="offline" class="glass-card" hidden>
        <div class="empty-orb warn"></div>
        <p>本机引擎没有在运行</p>
        <p class="hint">桌面壳可以替你把它无窗口拉起（Alt+S 或点按钮，等价于 lantelegram serve）</p>
        <button id="start-server" class="pill-btn primary">启动服务</button>
      </div>

      <section id="chat" class="glass" hidden>
        <header id="chat-head">
          <div class="peer-avatar" id="peer-avatar">?</div>
          <div class="peer-text">
            <div id="peer-name">…</div>
            <div id="peer-sub">离线</div>
          </div>
        </header>
        <div id="msgs"></div>
        <div id="reply-bar" hidden>
          <span>回复</span><span id="reply-text"></span>
          <button id="reply-cancel" aria-label="取消回复">✕</button>
        </div>
        <div id="pending-bar" hidden>
          <img id="pending-thumb" alt="" />
          <div class="pending-meta"><b id="pending-name"></b><span id="pending-kind">附件</span></div>
          <button id="pending-cancel" aria-label="移除附件">✕</button>
        </div>
        <footer id="composer">
          <button id="attach" class="icon-btn" title="发送文件/图片">
            <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.9-8.9a3.5 3.5 0 0 1 5 5l-8.9 8.8a2 2 0 0 1-2.8-2.8l7.9-7.9"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送 · Shift+Enter 换行）" autocomplete="off"></textarea>
          <button id="send" class="send-btn" title="发送">
            <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.5-7.5L3.4 5.4 3.4 11l12.5 1.9L3.4 14.9z"/></svg>
          </button>
        </footer>
      </section>
    </main>
  </div>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
